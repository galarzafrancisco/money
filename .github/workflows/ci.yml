# Money CI/CD. Follows the ai-monorepo flow (test -> image -> spark-ops PR).
# Triggers, image tags, secrets and assumptions are documented in docs/ci.md.
name: CI

on:
  pull_request:
    branches:
      - main
      - feature/**
  push:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel main: each merge must reach spark-ops
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    # Both database back ends run the full suite. Postgres covers the
    # concurrency/locking/trigger tests that are skipped on PGlite; PGlite is
    # what development and the temporary in-memory deployment use.
    name: Build and test (${{ matrix.database }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, pglite]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: money_ci
          POSTGRES_USER: money
          POSTGRES_PASSWORD: money_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U money -d money_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      # Admin connection: each test file creates and drops its own database
      TEST_POSTGRES_URL: ${{ matrix.database == 'postgres' && 'postgresql://money:money_ci@127.0.0.1:5432/postgres' || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ matrix.database }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ matrix.database }}-

      - name: Build
        run: npm run build

      - name: Verify @taico/auth imports
        run: npm run verify:auth

      - name: Typecheck
        run: npm run typecheck

      - name: Test @taico/auth
        run: npx nx run @taico/auth:test

      - name: Test backend
        # Each test file boots its own app and database; two workers keep
        # memory bounded (see docs/ci.md)
        run: npm -w @money/backend test -- --maxWorkers=2 --ci

      - name: Test web app
        # Vitest + Testing Library against a stand-in for the generated client
        run: npx nx run @money/web:test

  image:
    # Runs untrusted PR code, so it gets a read-only token. Publishing is the
    # separate main-only `publish` job, the only one with packages: write.
    name: Build container image
    runs-on: ubuntu-24.04-arm
    needs: test
    if: github.event_name != 'release'
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: money
          POSTGRES_USER: money
          POSTGRES_PASSWORD: money_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U money -d money"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: money:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image (PostgreSQL, as deployed)
        # Mirrors install/manifests: DATABASE_MODE=postgres, DATABASE_SSL=false,
        # DATABASE_URL from the environment, uid/gid 1000, read-only root
        # filesystem, small /tmp, no capabilities. Production mode: migrations
        # run, /health answers, unauthenticated /api and /mcp answer 401.
        # Then the container is replaced, as a redeploy would: migrations must
        # be a no-op and a row written before must still be there. Production
        # requires SESSION_ENCRYPTION_KEY; a throwaway key is generated per run.
        run: |
          set -euo pipefail
          key=$(openssl rand -base64 32)
          url=postgresql://money:money_ci@127.0.0.1:5432/money
          psql() { docker run --rm --network host postgres:16-alpine psql "$url" -v ON_ERROR_STOP=1 -tA "$@"; }
          start() {
            docker run -d --name money-smoke --network host \
              --user 1000:1000 \
              --read-only --tmpfs /tmp:size=64m --cap-drop ALL --security-opt no-new-privileges \
              -e PORT=4180 \
              -e SESSION_ENCRYPTION_KEY="$key" \
              -e DATABASE_MODE=postgres \
              -e DATABASE_SSL=false \
              -e DATABASE_URL="$url" \
              -e TAICO_ISSUER=https://taico.invalid \
              -e PUBLIC_BASE_URL=http://127.0.0.1:4180 \
              -e VALUATION_JOB_ENABLED=false \
              money:ci
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:4180/health; then echo; break; fi
              if [ "$i" = 60 ]; then echo "health check timed out"; docker logs money-smoke; exit 1; fi
              sleep 1
            done
          }
          start
          api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4180/api/accounts)
          mcp=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4180/mcp)
          echo "/api -> $api, /mcp -> $mcp"
          if [ "$api" != 401 ] || [ "$mcp" != 401 ]; then docker logs money-smoke; exit 1; fi
          # The web app is served at / (and for client-side routes) from the same origin
          curl -sf -H 'Accept: text/html' http://127.0.0.1:4180/accounts | grep -q '<div id="root">' || { echo "web app not served"; exit 1; }

          migrations=$(psql -c 'SELECT count(*) FROM migrations')
          echo "migrations applied: $migrations"
          [ "$migrations" -gt 0 ] || { echo "no migrations recorded"; exit 1; }
          psql -c "INSERT INTO users (id, issuer, subject) VALUES (gen_random_uuid(), 'https://smoke.invalid', 'restart-canary')"
          docker logs money-smoke > smoke-first.log 2>&1
          docker rm -f money-smoke

          start
          again=$(psql -c 'SELECT count(*) FROM migrations')
          canary=$(psql -c "SELECT count(*) FROM users WHERE subject = 'restart-canary'")
          echo "after restart: migrations $again, canary rows $canary"
          [ "$again" = "$migrations" ] || { echo "migrations changed across a restart"; exit 1; }
          [ "$canary" = 1 ] || { echo "data written before the restart is gone"; exit 1; }

      - name: Check image user is numeric and non-root
        # The kubelet can only verify runAsNonRoot against a numeric USER
        # (`USER node` fails with "image has non-numeric user"). Docker does
        # not enforce runAsNonRoot, so check it explicitly, and check that the
        # number still is the base image's `node` user, which the manifests'
        # runAsUser/runAsGroup (1000/1000) rely on.
        run: |
          set -euo pipefail
          user=$(docker image inspect money:ci --format '{{.Config.User}}')
          echo "image USER: $user"
          if ! echo "$user" | grep -Eq '^[1-9][0-9]*(:[0-9]+)?$'; then
            echo "image USER must be a numeric, non-zero uid[:gid]"; exit 1
          fi
          ids=$(docker run --rm --entrypoint sh money:ci -c 'echo "$(id -u):$(id -g) $(id -u node):$(id -g node)"')
          echo "runtime ids / node ids: $ids"
          [ "$ids" = "1000:1000 1000:1000" ] || { echo "expected uid/gid 1000:1000, the node user"; exit 1; }

      - name: Smoke test image (in-memory mode, and refusal without a database)
        # DATABASE_MODE=memory is no longer deployed, but stays a supported,
        # explicitly non-durable mode; checked with the same hardening. Also
        # checks that production refuses to start with no database configured,
        # including DATABASE_MODE=postgres without DATABASE_URL.
        run: |
          set -euo pipefail
          key=$(openssl rand -base64 32)
          if docker run --rm -e TAICO_ISSUER=https://taico.invalid -e SESSION_ENCRYPTION_KEY="$key" money:ci 2>&1 | tee refuse.log; then
            echo "image started in production without a database"; exit 1
          fi
          grep -q "DATABASE_URL is required in production" refuse.log
          if docker run --rm -e DATABASE_MODE=postgres -e TAICO_ISSUER=https://taico.invalid -e SESSION_ENCRYPTION_KEY="$key" money:ci 2>&1 | tee refuse-postgres.log; then
            echo "image started with DATABASE_MODE=postgres and no DATABASE_URL"; exit 1
          fi
          grep -q "DATABASE_MODE=postgres requires DATABASE_URL" refuse-postgres.log
          docker run -d --name money-memory --network host \
            -e SESSION_ENCRYPTION_KEY="$key" \
            --user 1000:1000 \
            --read-only --tmpfs /tmp:size=64m --cap-drop ALL --security-opt no-new-privileges \
            -e PORT=4181 \
            -e DATABASE_MODE=memory \
            -e TAICO_ISSUER=https://taico.invalid \
            -e PUBLIC_BASE_URL=http://127.0.0.1:4181 \
            money:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4181/health; then echo; break; fi
            if [ "$i" = 60 ]; then echo "health check timed out"; docker logs money-memory; exit 1; fi
            sleep 1
          done
          api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4181/api/accounts)
          mcp=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4181/mcp)
          echo "/api -> $api, /mcp -> $mcp"
          if [ "$api" != 401 ] || [ "$mcp" != 401 ]; then docker logs money-memory; exit 1; fi

      - name: Show container logs
        if: always()
        run: |
          tail -50 smoke-first.log 2>/dev/null || true
          docker logs money-smoke 2>&1 | tail -50 || true
          docker logs money-memory 2>&1 | tail -30 || true

  manifests:
    # main auto-deploys through spark-ops, so manifests must render before merge
    name: Render deployment manifests
    runs-on: ubuntu-24.04-arm
    if: github.event_name != 'release'
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # Only needs `yaml` for the security check; skip lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Render as the deploy job and spark-ops will
        # Same image pin as `deploy`, on a copy, then build the overlay Argo CD syncs
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp -r install/manifests "$work/money"
          printf 'DOMAIN=example.invalid\n' > "$work/money/overlays/main/env.env"
          (cd "$work/money/base" && kustomize edit set image "$IMAGE=$IMAGE:main-0000000")
          kustomize build "$work/money/overlays/main" > "$work/rendered.yaml"
          grep -q "image: $IMAGE:main-0000000" "$work/rendered.yaml"
          cat "$work/rendered.yaml"
          # Numeric non-root user and the rest of the hardening (the kubelet
          # refuses runAsNonRoot with a non-numeric image user)
          node scripts/check-manifest-security.mjs "$work/rendered.yaml"
          # Durable Postgres, DATABASE_URL only from the spark-ops Secret
          node scripts/check-manifest-database.mjs "$work/rendered.yaml"

  publish:
    # Only job holding packages: write for branch builds. It never runs on
    # pull_request events, so PR code cannot obtain a GHCR-writable token.
    name: Push container image
    runs-on: ubuntu-24.04-arm
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source.branch=${{ github.ref_name }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        # Same commit and Dockerfile as the smoke-tested build in `image`, so
        # layers come from the shared GHA build cache
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release-tag:
    name: Tag existing image with release tag
    runs-on: ubuntu-24.04-arm
    needs: test
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote main-<sha> image to release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          SOURCE_TAG="main-$(git rev-parse --short=7 HEAD)"
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" "$IMAGE:$SOURCE_TAG"

  deploy:
    name: Copy manifests to spark-ops
    runs-on: ubuntu-24.04-arm
    needs: [publish, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout money
        uses: actions/checkout@v5
        with:
          path: money

      - name: Check for deployment manifests
        id: manifests
        run: |
          if [ -f money/install/manifests/base/kustomization.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::install/manifests/base/kustomization.yaml not found; image pushed but no spark-ops deployment PR opened."
          fi

      - name: Checkout spark-ops
        if: steps.manifests.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          repository: galarzafrancisco/spark-ops
          token: ${{ secrets.SPARK_OPS_TOKEN }}
          path: spark-ops

      - name: Setup Kustomize
        if: steps.manifests.outputs.present == 'true'
        uses: imranismail/setup-kustomize@v2

      - name: Extract image tag
        id: image-tag
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "tag=main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Copy manifests to spark-ops
        if: steps.manifests.outputs.present == 'true'
        run: |
          set -euo pipefail
          rm -rf spark-ops/k8s/money
          mkdir -p spark-ops/k8s
          cp -r money/install/manifests spark-ops/k8s/money
          cd spark-ops/k8s/money/base
          kustomize edit set image "$IMAGE=$IMAGE:${{ steps.image-tag.outputs.tag }}"

      - name: Create spark-ops pull request
        if: steps.manifests.outputs.present == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SPARK_OPS_TOKEN }}
          path: spark-ops
          commit-message: |
            deploy: update money manifests and image to ${{ steps.image-tag.outputs.tag }}

            Source: ${{ github.repository }}@${{ github.sha }}
            Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          branch: deploy/money-${{ steps.image-tag.outputs.sha }}
          delete-branch: true
          title: "Deploy money (${{ steps.image-tag.outputs.tag }})"
          body: |
            ## Deployment Update

            **Service**: money
            **Image Tag**: `${{ steps.image-tag.outputs.tag }}`
            **Source Commit**: ${{ github.sha }}

            ### Changes
            - Copied latest manifests from `install/manifests/`
            - Updated image tag to `${{ steps.image-tag.outputs.tag }}`

            ### Build Information
            - **Build Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Image**: `${{ env.IMAGE }}:${{ steps.image-tag.outputs.tag }}`

            ---
            *This PR will be automatically validated and merged by spark-ops workflow.*

          labels: |
            automated-deployment
            money
