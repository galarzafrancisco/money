apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD (spark-ops ApplicationSet) deploys k8s/money/overlays/main into the
# `money` namespace. spark-ops hydration writes a shared env.env here; Money's
# settings are not secret and are not in it, so this overlay doesn't read it.
resources:
  - ../../base
