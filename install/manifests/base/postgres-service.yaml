apiVersion: v1
kind: Service
metadata:
  name: money-postgres
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 15434
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: money-postgres-host
  labels:
    kubernetes.io/service-name: money-postgres
addressType: IPv4
ports:
  - name: postgres
    protocol: TCP
    port: 15434
endpoints:
  - addresses:
      - PLACEHOLDER_SPARK_IP
    conditions:
      ready: true
