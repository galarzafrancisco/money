apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: money
  namespace: money
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: money
      sectionName: https
  hostnames:
    - money.american-broomstick.com
  # The whole host goes to the backend: /api, /mcp, /auth (browser sign-in and
  # /auth/client-metadata.json, which Taico must reach publicly), /health and
  # /.well-known/oauth-protected-resource.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: money
          port: 80
