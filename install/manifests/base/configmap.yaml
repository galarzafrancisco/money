apiVersion: v1
kind: ConfigMap
metadata:
  name: money-config
  namespace: money
data:
  # NODE_ENV=production and PORT=4180 come from the image.
  PUBLIC_BASE_URL: https://money.american-broomstick.com
  # Taico signs access tokens with this issuer; JWKS is {issuer}/.well-known/jwks.json.
  # Audiences are $PUBLIC_BASE_URL/mcp and $PUBLIC_BASE_URL/api.
  TAICO_ISSUER: https://taico.app
  # Authorization server of Taico's registered `money` MCP server entry,
  # advertised in protected-resource metadata so MCP clients can sign in.
  TAICO_AUTHORIZATION_SERVERS: https://taico.app/mcp/money/0.0.0
  # Durable PostgreSQL: the dedicated money-postgres instance on the Spark host,
  # provisioned by spark-ops (bootstrap/money-postgres.sh). DATABASE_URL comes
  # from the money-database Secret (see deployment.yaml), never from here.
  # Explicit, so a missing URL fails startup instead of picking another mode.
  DATABASE_MODE: postgres
  # Host-local connection without TLS, as provisioned by spark-ops.
  DATABASE_SSL: "false"
  # Real prices from Yahoo Finance's unofficial, keyless chart endpoint (delayed;
  # personal tracking only). Read store-first and throttled; see
  # apps/backend/docs/market-prices.md. "mock" switches back to labelled made-up prices.
  MARKET_PRICE_PROVIDER: yahoo
  # Read-only Up import (apps/backend/docs/up-integration.md). Up's real API and
  # the single global webhook callback ($PUBLIC_BASE_URL/api/v1/webhooks/up,
  # registered with Up on connect). UP_ENCRYPTION_KEY comes from the money-up Secret.
  UP_API_BASE_URL: https://api.up.com.au/api/v1
  UP_REGISTER_WEBHOOK: "true"
