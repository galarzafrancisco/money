apiVersion: apps/v1
kind: Deployment
metadata:
  name: money
  namespace: money
  labels:
    app: money
spec:
  # One pod, replaced with Recreate: migrations run on startup, and TypeORM
  # doesn't serialize two pods migrating the same database at once. Data lives
  # in PostgreSQL, so replacing the pod loses nothing.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: money
  template:
    metadata:
      labels:
        app: money
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: money
          image: ghcr.io/galarzafrancisco/money:main
          ports:
            - containerPort: 4180
              name: http
              protocol: TCP
          env:
            # postgresql://money:<password>@money-postgres:5432/money. The
            # Secret, the money-postgres Service and its EndpointSlice belong
            # to spark-ops (bootstrap/money-postgres.sh); Money only consumes
            # them. Never copy the value into Git. Not optional: without it
            # production refuses to start, it never falls back to memory.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: money-database
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: money-config
            # SESSION_ENCRYPTION_KEY (32 random bytes, base64): encrypts Taico
            # tokens of browser sessions at rest. Provisioned out of band,
            # never committed. Not optional: a missing key must stop the pod.
            - secretRef:
                name: money-session
          # Numeric user and group, as in spark-ops' other hardened workloads.
          # The kubelet enforces runAsNonRoot only against a numeric UID; 1000
          # is the image's `node` user (Dockerfile USER 1000:1000).
          # scripts/check-manifest-security.mjs checks this in CI.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            # The database is outside the pod now. Measured against Postgres
            # (hardened image, after startup migrations): ~90 MiB. The limit
            # leaves room for full-ledger replays and valuation backfills.
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          # /health runs SELECT 1, so a Postgres outage turns the pod unready
          # and, after ~2 minutes, restarts it. Lenient so a short database
          # restart doesn't cause one.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
