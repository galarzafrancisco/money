apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: money-https-redirect
  namespace: money
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: gateways
      sectionName: http
  hostnames:
    - money.american-broomstick.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
