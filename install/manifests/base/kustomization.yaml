apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deployed by CI: the whole install/manifests tree is copied to
# spark-ops/k8s/money, the image below is pinned to main-<sha7> with
# `kustomize edit set image`, and spark-ops auto-merges. See docs/deployment.md.
namespace: money

resources:
  - ./namespace.yaml
  - ./configmap.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./certificate.yaml
  - ./listener-set.yaml
  - ./route.yaml
  - ./https-redirect.yaml

images:
  - name: ghcr.io/galarzafrancisco/money
    newName: ghcr.io/galarzafrancisco/money
    newTag: main
